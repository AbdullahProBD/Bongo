name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Apple Silicon Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Build macOS DMG
        run: |
          ./platforms/macos/scripts/create-dmg.sh

      - name: Generate Checksums
        run: |
          cd platforms/macos/release
          for dmg in *.dmg; do
            if [ -f "$dmg" ]; then
              shasum -a 256 "$dmg" > "${dmg}.sha256"
              echo "Generated checksum for $dmg:"
              cat "${dmg}.sha256"
            fi
          done

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-macos-arm64-dmg
          path: |
            platforms/macos/release/*.dmg
            platforms/macos/release/*.sha256

  build-linux:
    name: Build Linux DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Install IBus & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libibus-1.0-dev

      - name: Build Debian Package
        run: |
          bash platforms/linux/scripts/build-deb.sh

      - name: Generate Checksums
        run: |
          cd platforms/linux/release
          for deb in *.deb; do
            if [ -f "$deb" ]; then
              shasum -a 256 "$deb" > "${deb}.sha256"
              echo "Generated checksum for $deb:"
              cat "${deb}.sha256"
            fi
          done

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bongo-linux-amd64-deb
          path: |
            platforms/linux/release/*.deb
            platforms/linux/release/*.sha256

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Setup Packaging Tools
        shell: pwsh
        run: |
          choco install innosetup wixtoolset -y --no-progress

      - name: Build Windows Packages
        shell: cmd
        run: |
          call platforms\windows\scripts\build-windows.bat

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bongo-windows-packages
          path: |
            platforms/windows/release/*.exe
            platforms/windows/release/*.msi
            platforms/windows/release/*.zip
            platforms/windows/release/*.sha256

  publish:
    name: Publish Release
    needs: [build-dmg, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.deb
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.zip
            release-artifacts/*.sha256
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
