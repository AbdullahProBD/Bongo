name: Build and Release Windows Packages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Upload Windows Packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Setup Packaging Tools
        shell: pwsh
        run: |
          choco install innosetup wixtoolset -y --no-progress

      - name: Build Windows Packages
        shell: cmd
        run: |
          call platforms\windows\scripts\build-windows.bat

      - name: Verify Installer Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "platforms/windows/release/Bongo-Setup-1.0.0.exe")) {
            throw "Bongo-Setup-1.0.0.exe was not created!"
          }
          if (-not (Test-Path "platforms/windows/release/Bongo-1.0.0-x64.msi")) {
            throw "Bongo-1.0.0-x64.msi was not created!"
          }
          Get-ChildItem platforms/windows/release

      - name: Upload Windows Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: bongo-windows-packages
          path: |
            platforms/windows/release/*.exe
            platforms/windows/release/*.msi
            platforms/windows/release/*.sha256

      - name: Attach Windows Packages to v1.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: |
            platforms/windows/release/*.exe
            platforms/windows/release/*.msi
            platforms/windows/release/*.sha256
